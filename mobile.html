<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1C2B4A">
<title>BM4 Mobile</title>
<link rel="manifest" href="manifest.json?v=rc14">
<style>
:root{
  --navy:#1C2B4A;
  --accent:#2563EB;
  --bg:#F2F1EE;
  --surface:#fff;
  --text:#1C1C1A;
  --muted:#64748B;
  --border:rgba(0,0,0,.08);
  --danger:#DC2626;
  --ok:#059669;
  --warn:#F59E0B;
  --purple:#7C3AED;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ============== LOADING SCREEN ============== */
.boot-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#1C2B4A 0%,#0F1A35 100%);color:#fff;padding:24px}
.boot-screen .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:14px}
.boot-screen p{font-size:13px;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============== LOGIN SCREEN ============== */
.login-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;background:linear-gradient(180deg,#1C2B4A 0%,#0F1A35 100%)}
.login-box{background:#fff;border-radius:20px;padding:28px 22px;max-width:380px;width:100%;margin:0 auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo .icon{width:56px;height:56px;background:var(--navy);color:#fff;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin-bottom:10px}
.login-logo h1{font-size:18px;margin:0;color:var(--text)}
.login-logo p{font-size:12px;color:var(--muted);margin:4px 0 0}
.login-box label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.login-box input{width:100%;border:1px solid var(--border);border-radius:12px;padding:13px 14px;font:inherit;font-size:14px;background:#FAFAF8}
.login-box input:focus{outline:none;border-color:var(--accent);background:#fff}
.login-box .btn-login{width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:14px;margin-top:18px;cursor:pointer}
.login-box .btn-login:disabled{opacity:.6}
.login-box .btn-login:active{transform:scale(.98)}
.login-box .err{background:#FEF2F2;color:var(--danger);font-size:12px;padding:10px 12px;border-radius:10px;margin-top:14px;display:none;border:1px solid #FECACA}
.login-box .err.show{display:block}
.login-box .info{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
.login-box .info a{color:var(--accent);text-decoration:none}
.login-box .loader{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
.login-box .btn-login.loading .loader{display:inline-block}

/* ============== APP SCREEN ============== */
.app-screen{display:none}
.app-screen.show{display:block}

/* Header user */
.user-header{background:var(--navy);color:#fff;padding:14px 16px}
.user-header-row{display:flex;align-items:center;gap:10px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-info{flex:1;min-width:0}
.user-name{font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:#94A3B8;margin-top:2px}
.btn-logout{font-size:11px;padding:6px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:999px;cursor:pointer}
.btn-logout:active{background:rgba(255,255,255,.2)}

.proyek-bar{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;margin-top:10px;display:flex;align-items:center;gap:8px}
.proyek-bar label{font-size:10px;color:#94A3B8;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.proyek-bar select{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-size:12px}
.proyek-bar select option{background:var(--navy);color:#fff}

/* Sync indicator */
.sync-state{padding:6px 10px;font-size:11px;text-align:center;color:#94A3B8;background:rgba(0,0,0,.04)}
.sync-state.loading{color:var(--accent)}
.sync-state.err{color:var(--danger);background:#FEF2F2}

/* Content wrapper */
.content{padding:12px;max-width:620px;margin:0 auto}

/* Stats card grid */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 12px}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.stat-value{font-size:22px;font-weight:700;line-height:1.1}
.stat-value.warn{color:var(--warn)}
.stat-value.ok{color:var(--ok)}

/* Pipeline bar */
.pipeline-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.pipeline-card .label{font-size:11px;color:var(--muted);margin-bottom:8px}
.pipeline-bar{display:flex;gap:3px;height:6px;border-radius:999px;overflow:hidden;margin-bottom:8px;background:#F1F5F9}
.pipeline-bar .seg{height:100%}
.pipeline-bar .seg.s0{background:#94A3B8}
.pipeline-bar .seg.s1{background:#3B82F6}
.pipeline-bar .seg.s2{background:#F59E0B}
.pipeline-bar .seg.s3{background:#EC4899}
.pipeline-bar .seg.s4{background:#10B981}
.pipeline-legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:10px;color:var(--muted)}
.pipeline-legend .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}

/* Action button */
.btn-primary{width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:13px;margin-bottom:10px;cursor:pointer}
.btn-primary:active{transform:scale(.99)}

/* List header */
.list-header{display:flex;justify-content:space-between;align-items:center;margin:6px 4px 8px}
.list-header .title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.list-header .count{font-size:11px;color:var(--muted)}

/* Target card */
.target-card{background:#fff;border:1px solid var(--border);border-left:3px solid #94A3B8;border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.target-card.s0{border-left-color:#94A3B8}
.target-card.s1{border-left-color:#3B82F6}
.target-card.s2{border-left-color:#F59E0B}
.target-card.s3{border-left-color:#EC4899}
.target-card.s4{border-left-color:#10B981}
.target-card-head{display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:5px}
.target-card-name{font-weight:700;font-size:13px;line-height:1.3;flex:1}
.target-card-badge{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
.target-card-badge.s0{background:#F1F5F9;color:#475569}
.target-card-badge.s1{background:#DBEAFE;color:#1E40AF}
.target-card-badge.s2{background:#FEF3C7;color:#92400E}
.target-card-badge.s3{background:#FCE7F3;color:#9F1239}
.target-card-badge.s4{background:#D1FAE5;color:#065F46}
.target-card-meta{font-size:11px;color:var(--muted);line-height:1.5}

.empty-state{text-align:center;padding:32px 16px;color:var(--muted)}
.empty-state .icon{font-size:36px;margin-bottom:8px;opacity:.5}
.empty-state p{font-size:13px;margin:4px 0}
.empty-state .hint{font-size:11px;margin-top:8px}

/* Filter pills */
.filter-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.filter-pills::-webkit-scrollbar{display:none}
.pill-filter{background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:600;white-space:nowrap;color:var(--muted);cursor:pointer}
.pill-filter.active{background:var(--navy);border-color:var(--navy);color:#fff}

/* No-access placeholder */
.no-access{padding:40px 20px;text-align:center}
.no-access .icon{font-size:48px;margin-bottom:12px}
.no-access h2{font-size:16px;margin:0 0 8px}
.no-access p{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0}

/* Toast */
.toast{position:fixed;left:16px;right:16px;bottom:16px;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:.2s;z-index:200;font-size:13px;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}

/* Footer */
.footer{font-size:10px;text-align:center;color:#94A3B8;padding:18px 16px}
.footer a{color:#60A5FA;text-decoration:none}
</style>
</head>
<body>

<!-- ========== LAYAR LOADING (auto-login check) ========== -->
<div class="boot-screen" id="screen-boot">
  <div class="spinner"></div>
  <p>Memuat...</p>
</div>

<!-- ========== LAYAR LOGIN ========== -->
<div class="login-screen" id="screen-login" style="display:none">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">B4</div>
      <h1>BM4 Mobile</h1>
      <p>Masuk dengan akun tim kamu</p>
    </div>
    <label>Username</label>
    <input type="text" id="login-username" autocomplete="username" autocapitalize="none" autocorrect="off" placeholder="contoh: strategi1">
    <label>Password</label>
    <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••">
    <div class="err" id="login-err">Username atau password salah.</div>
    <button class="btn-login" id="btn-login"><span class="loader"></span><span class="btn-label">Masuk</span></button>
    <div class="info">
      Login pertama butuh internet.<br>
      Belum punya akun? Hubungi BM kamu.<br>
      <a href="index.html?desktop=1&v=rc14">Buka versi desktop ↗</a>
    </div>
  </div>
</div>

<!-- ========== LAYAR APLIKASI ========== -->
<div class="app-screen" id="screen-app">
  <div class="user-header">
    <div class="user-header-row">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">-</div>
        <div class="user-role" id="user-role">-</div>
      </div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
    <div class="proyek-bar">
      <label>Proyek</label>
      <select id="proyek-select"></select>
    </div>
  </div>

  <div class="sync-state" id="sync-state" style="display:none"></div>

  <div class="content" id="content-area">
    <!-- Konten dinamis sesuai role -->
  </div>

  <div class="footer">BM4 Mobile v14 &middot; <a href="index.html?desktop=1&v=rc14">Buka desktop &uarr;</a></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// BM4 Mobile v14 — Login via Apps Script (Mini-Tahap 1A revisi)
// ============================================================

// ===== CONFIG (sinkron dengan desktop) =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyPm0hR8SqqI572qjkaZ97PERPocBcE7ydhRcjoY_hve1qI6PItWMJeZ94kwG_q_gHpaw/exec';

const LS = {
  TOKEN: 'bm4_secure_session_token',
  USER: 'bm4_secure_user',
  PROYEK: 'bm4_proyek',
  LAST_PROYEK: 'bm4_mobile_last_proyek',
  TP_TARGETS: 'bm4_tp_targets'
};

const PROYEK_DEFAULT = [
  {id:'gwc', nama:'Griya Wijaya Cibogo', kode:'GWC', area:'Cibogo, Subang'},
  {id:'dpr', nama:'Dirgantara Parahyangan Residence', kode:'DPR', area:'Subang'}
];

// ===== PERMISSION MAP (Mini-Tahap 1A: hardcode) =====
// Mini-Tahap 1B nanti akan dipindah ke Sheets, BM bisa atur sendiri.
const MOBILE_PERMISSIONS = {
  bm: {
    role_label: 'Branch Manager',
    modules: ['target_pasar'],
    target_pasar: { view:true, create:true, edit:true, delete:true }
  },
  owner: {
    role_label: 'Owner',
    modules: ['target_pasar'],
    target_pasar: { view:true, create:true, edit:true, delete:true }
  },
  admin: {
    role_label: 'Admin',
    modules: ['target_pasar'],
    target_pasar: { view:true, create:true, edit:true, delete:true }
  },
  strategi: {
    role_label: 'Strategi Promo',
    modules: ['target_pasar'],
    target_pasar: { view:true, create:true, edit:true, delete:false }
  },
  manager: { role_label:'Manager', modules:[] },
  sales: { role_label:'Sales', modules:[] },
  konstruksi: { role_label:'Konstruksi', modules:[] },
  viewer: { role_label:'Viewer', modules:[] }
};

const STATUS_LABELS = ['Identifikasi','Kontak Awal','Presentasi','Negosiasi','Deal'];
const STATUS_ICONS  = ['🔍','📞','🤝','💬','✅'];
const STATUS_COLORS = ['#94A3B8','#3B82F6','#F59E0B','#EC4899','#10B981'];

// ===== State =====
let currentUser = null;
let sessionToken = '';
let proyekList = [];
let currentProyekId = 'gwc';
let tpTargets = [];
let activeFilter = 'all';

// ============================================================
// Helpers
// ============================================================
function $(id){return document.getElementById(id);}
function esc(s){return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg, kind){
  const t=$('toast');
  t.textContent=msg;
  t.className='toast show '+(kind||'');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function showSyncState(msg, kind){
  const el=$('sync-state');
  if(!msg){el.style.display='none';return;}
  el.textContent=msg;
  el.className='sync-state '+(kind||'');
  el.style.display='block';
}

// ============================================================
// Apps Script request helper
// ============================================================
async function gasRequest(action, payload, opts){
  opts = opts || {};
  const body = Object.assign({ action }, payload || {});
  if(sessionToken && !opts.noToken) body.sessionToken = sessionToken;
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body),
    cache: 'no-store'
  });
  let json;
  try { json = await res.json(); }
  catch(e){ throw new Error('Server tidak respon JSON. Cek koneksi internet.'); }
  if(!json || json.success === false){
    const msg = (json && (json.message || json.error)) || 'Request gagal';
    const err = new Error(msg);
    err.response = json;
    throw err;
  }
  return json;
}

async function gasGet(action, extraParams){
  const params = Object.assign({}, extraParams||{}, {action, _t:Date.now()});
  if(sessionToken) params.sessionToken = sessionToken;
  const url = GAS_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url, {cache:'no-store'});
  let json;
  try { json = await res.json(); }
  catch(e){ throw new Error('Server tidak respon JSON.'); }
  if(!json || json.success === false){
    const msg = (json && (json.message || json.error)) || 'Request gagal';
    const err = new Error(msg);
    err.response = json;
    throw err;
  }
  return json;
}

// ============================================================
// LOGIN FLOW
// ============================================================
async function doLogin(){
  const u = $('login-username').value.trim().toLowerCase();
  const p = $('login-password').value;
  const err = $('login-err');
  const btn = $('btn-login');
  err.classList.remove('show');

  if(!u || !p){
    err.textContent = 'Username dan password wajib diisi.';
    err.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');
  btn.querySelector('.btn-label').textContent = 'Memverifikasi...';

  try {
    const r = await gasRequest('auth_login', {
      username: u,
      password: p,
      deviceInfo: 'mobile-' + (navigator.userAgent || 'browser').slice(0, 200)
    }, { noToken: true });

    // Sukses — simpan token & user
    sessionToken = r.sessionToken;
    currentUser = r.user;
    try {
      // Pendekatan B: simpan di localStorage supaya persist sampai logout manual
      localStorage.setItem(LS.TOKEN, sessionToken);
      localStorage.setItem(LS.USER, JSON.stringify(currentUser));
    } catch(e){}

    toast('Selamat datang, ' + (currentUser.nama || currentUser.username), 'ok');
    await enterApp();
  } catch(e){
    console.error('[Login] error:', e);
    err.textContent = e.message || 'Login gagal. Coba lagi.';
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.querySelector('.btn-label').textContent = 'Masuk';
  }
}

async function doLogout(){
  if(!confirm('Yakin keluar dari akun ini?')) return;
  // Coba logout di server, tapi tidak masalah kalau gagal (offline)
  try { await gasRequest('auth_logout', {sessionToken}); } catch(e){}
  sessionToken = '';
  currentUser = null;
  try {
    localStorage.removeItem(LS.TOKEN);
    localStorage.removeItem(LS.USER);
  } catch(e){}
  $('screen-app').classList.remove('show');
  $('screen-login').style.display = '';
  $('login-username').value = '';
  $('login-password').value = '';
  toast('Berhasil keluar');
}

async function tryAutoLogin(){
  // Coba ambil token dari localStorage
  let savedToken = '';
  let savedUser = null;
  try {
    savedToken = localStorage.getItem(LS.TOKEN) || '';
    const userRaw = localStorage.getItem(LS.USER);
    if(userRaw) savedUser = JSON.parse(userRaw);
  } catch(e){}

  if(!savedToken || !savedUser) return false;

  // Verify token ke server
  sessionToken = savedToken;
  try {
    const r = await gasRequest('auth_verify');
    currentUser = r.user || savedUser;
    // Update cached user (mungkin role/akses berubah)
    try { localStorage.setItem(LS.USER, JSON.stringify(currentUser)); } catch(e){}
    return true;
  } catch(e){
    console.warn('[AutoLogin] token invalid:', e.message);
    sessionToken = '';
    currentUser = null;
    try {
      localStorage.removeItem(LS.TOKEN);
      localStorage.removeItem(LS.USER);
    } catch(e){}
    return false;
  }
}

// ============================================================
// PROYEK LIST
// ============================================================
async function loadProyekList(){
  // Coba dari Sheets dulu (kalau online)
  try {
    const r = await gasGet('getProyek');
    if(r.success && Array.isArray(r.data) && r.data.length > 0){
      proyekList = r.data.map(p => ({
        id: p.id, nama: p.nama, kode: p.kode || p.id, area: p.area || ''
      }));
      try { localStorage.setItem(LS.PROYEK, JSON.stringify(proyekList)); } catch(e){}
      return;
    }
  } catch(e){
    console.warn('[Proyek] load from Sheets failed, fallback to local:', e.message);
  }
  // Fallback: dari localStorage
  try {
    const saved = localStorage.getItem(LS.PROYEK);
    if(saved){
      const arr = JSON.parse(saved);
      if(Array.isArray(arr) && arr.length > 0){
        proyekList = arr;
        return;
      }
    }
  } catch(e){}
  // Last fallback: default
  proyekList = PROYEK_DEFAULT.slice();
}

function renderProyekDropdown(){
  const sel = $('proyek-select');
  sel.innerHTML = proyekList.map(p =>
    `<option value="${esc(p.id)}">${esc(p.nama)} (${esc(p.kode||p.id)})</option>`
  ).join('');
  let last = '';
  try { last = localStorage.getItem(LS.LAST_PROYEK) || ''; } catch(e){}
  if(last && proyekList.some(p => p.id === last)){
    sel.value = last;
    currentProyekId = last;
  } else {
    currentProyekId = proyekList[0].id;
    sel.value = currentProyekId;
  }
  sel.onchange = () => {
    currentProyekId = sel.value;
    try { localStorage.setItem(LS.LAST_PROYEK, currentProyekId); } catch(e){}
    activeFilter = 'all';
    renderContent();
  };
}

// ============================================================
// TARGET PASAR DATA
// ============================================================
async function loadTpTargets(){
  showSyncState('Memuat data...', 'loading');
  try {
    const r = await gasGet('getTargetPasar');
    if(r.success && Array.isArray(r.data)){
      tpTargets = r.data.map(row => ({
        id: parseInt(row.id),
        proyek: String(row.proyek || 'gwc').toLowerCase(),
        nama: row.nama,
        jenis: row.jenis,
        lat: parseFloat(row.lat),
        lng: parseFloat(row.lng),
        karyawan: parseInt(row.karyawan) || 0,
        pic: row.pic || '',
        lastcontact: row.lastcontact || '-',
        status: parseInt(row.status) || 0,
        catatan: row.catatan || ''
      }));
      try { localStorage.setItem(LS.TP_TARGETS, JSON.stringify(tpTargets)); } catch(e){}
      showSyncState('');
      return;
    }
  } catch(e){
    console.warn('[TP] load from Sheets failed:', e.message);
    showSyncState('Offline - pakai data lokal', 'err');
    setTimeout(() => showSyncState(''), 3000);
  }
  // Fallback localStorage
  try {
    const saved = localStorage.getItem(LS.TP_TARGETS);
    if(saved){
      const arr = JSON.parse(saved);
      if(Array.isArray(arr)){
        tpTargets = arr.map(t => Object.assign({}, t, {
          proyek: String(t.proyek || 'gwc').toLowerCase()
        }));
        return;
      }
    }
  } catch(e){}
  tpTargets = [];
}

function getTargetsForCurrentProyek(){
  return tpTargets.filter(t => String(t.proyek||'gwc').toLowerCase() === currentProyekId);
}

// ============================================================
// SCREEN FLOW
// ============================================================
function showLogin(){
  $('screen-boot').style.display = 'none';
  $('screen-app').classList.remove('show');
  $('screen-login').style.display = '';
}

async function enterApp(){
  $('screen-boot').style.display = 'none';
  $('screen-login').style.display = 'none';
  $('screen-app').classList.add('show');

  // Render header user
  const av = $('user-avatar');
  if(currentUser.foto && String(currentUser.foto).startsWith('data:image/')){
    av.innerHTML = `<img src="${currentUser.foto}" alt="">`;
  } else {
    av.textContent = (currentUser.nama || currentUser.username || '?').charAt(0).toUpperCase();
  }
  $('user-name').textContent = currentUser.nama || currentUser.username;
  const perm = MOBILE_PERMISSIONS[currentUser.role] || {};
  $('user-role').textContent = perm.role_label || currentUser.role || '';

  // Load data sekuensial
  await loadProyekList();
  renderProyekDropdown();
  await loadTpTargets();
  renderContent();
}

// ============================================================
// CONTENT RENDERING (dinamis sesuai role)
// ============================================================
function renderContent(){
  const role = currentUser.role || 'viewer';
  const perm = MOBILE_PERMISSIONS[role];
  if(!perm || !perm.modules || perm.modules.length === 0){
    renderNoAccess();
    return;
  }
  if(perm.modules.includes('target_pasar')){
    renderTargetPasarDashboard();
  } else {
    renderNoAccess();
  }
}

function renderNoAccess(){
  $('content-area').innerHTML = `
    <div class="no-access">
      <div class="icon">🔒</div>
      <h2>Belum ada akses mobile</h2>
      <p>Akun <b>${esc(currentUser.username)}</b> dengan role <b>${esc(currentUser.role||'-')}</b> belum punya akses ke fitur mobile.</p>
      <p>Hubungi Branch Manager untuk meminta akses, atau gunakan versi desktop.</p>
      <p style="margin-top:18px"><a href="index.html?desktop=1&v=rc14" style="color:var(--accent);font-weight:600;text-decoration:none">Buka versi desktop &uarr;</a></p>
    </div>
  `;
}

function renderTargetPasarDashboard(){
  const role = currentUser.role;
  const perm = (MOBILE_PERMISSIONS[role]||{}).target_pasar || {};
  const targets = getTargetsForCurrentProyek();
  const proj = proyekList.find(p => p.id === currentProyekId);

  // Statistik
  const total = targets.length;
  const byStatus = [0,0,0,0,0];
  targets.forEach(t => {
    const s = parseInt(t.status) || 0;
    if(s>=0 && s<=4) byStatus[s]++;
  });
  const aktif = byStatus[1] + byStatus[2] + byStatus[3];

  // Filter
  let filtered = targets;
  if(activeFilter !== 'all'){
    const fs = parseInt(activeFilter);
    filtered = targets.filter(t => (parseInt(t.status)||0) === fs);
  }
  filtered = filtered.slice().sort((a,b) => (parseInt(b.status)||0) - (parseInt(a.status)||0));

  let html = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total target</div>
        <div class="stat-value">${total}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pipeline aktif</div>
        <div class="stat-value warn">${aktif}</div>
      </div>
    </div>
  `;

  if(total > 0){
    const segs = byStatus.map((n,i) => n>0 ? `<div class="seg s${i}" style="flex:${n}"></div>` : '').filter(Boolean).join('');
    html += `
      <div class="pipeline-card">
        <div class="label">Distribusi status</div>
        <div class="pipeline-bar">${segs || '<div class="seg s0" style="flex:1;opacity:.3"></div>'}</div>
        <div class="pipeline-legend">
          ${byStatus.map((n,i) => `<span><span class="dot" style="background:${STATUS_COLORS[i]}"></span>${esc(STATUS_LABELS[i])} ${n}</span>`).join('')}
        </div>
      </div>
    `;
  }

  if(perm.create){
    html += `<button class="btn-primary" onclick="openAddTarget()">+ Tambah Target Baru</button>`;
  }

  // Filter pills
  html += `
    <div class="filter-pills">
      <button class="pill-filter ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">Semua (${total})</button>
      ${STATUS_LABELS.map((lbl,i) => byStatus[i]===0 ? '' :
        `<button class="pill-filter ${activeFilter===String(i)?'active':''}" onclick="setFilter('${i}')">${STATUS_ICONS[i]} ${esc(lbl)} (${byStatus[i]})</button>`
      ).filter(Boolean).join('')}
    </div>
  `;

  html += `
    <div class="list-header">
      <span class="title">Daftar target</span>
      <span class="count">Proyek: ${esc(proj ? (proj.kode||proj.id) : currentProyekId)}</span>
    </div>
  `;

  if(filtered.length === 0){
    if(total === 0){
      html += `
        <div class="empty-state">
          <div class="icon">🎯</div>
          <p><b>Belum ada target</b></p>
          <p>untuk proyek ${esc(proj?proj.nama:currentProyekId)}</p>
          ${perm.create ? '<p class="hint">Tap tombol "+ Tambah Target Baru" di atas untuk mulai.</p>' : ''}
        </div>
      `;
    } else {
      html += `
        <div class="empty-state">
          <p>Tidak ada target di filter ini.</p>
          <p class="hint" style="margin-top:6px">Tap "Semua" untuk lihat semua target.</p>
        </div>
      `;
    }
  } else {
    html += filtered.map(t => renderTargetCard(t, perm)).join('');
  }

  $('content-area').innerHTML = html;
}

function renderTargetCard(t, perm){
  const s = parseInt(t.status) || 0;
  const lbl = STATUS_LABELS[s] || '-';
  const ic = STATUS_ICONS[s] || '';
  const meta = [];
  if(t.karyawan) meta.push(Number(t.karyawan).toLocaleString('id-ID') + ' karyawan');
  if(t.jenis) meta.push(t.jenis);
  const meta1 = meta.join(' • ');
  const meta2 = t.pic ? 'PIC: ' + esc(t.pic) : '';
  const onclick = perm.edit ? `onclick="openEditTarget(${parseInt(t.id)||0})"` : '';
  return `
    <div class="target-card s${s}" ${onclick}>
      <div class="target-card-head">
        <div class="target-card-name">${esc(t.nama || '(tanpa nama)')}</div>
        <div class="target-card-badge s${s}">${ic} ${esc(lbl)}</div>
      </div>
      ${meta1 ? `<div class="target-card-meta">${esc(meta1)}</div>` : ''}
      ${meta2 ? `<div class="target-card-meta">${meta2}</div>` : ''}
    </div>
  `;
}

function setFilter(f){
  activeFilter = f;
  renderContent();
}

// ============================================================
// PLACEHOLDER untuk Mini-Tahap 2 (form input target lengkap)
// ============================================================
function openAddTarget(){
  toast('Form input target dengan mini-map akan tersedia di update berikutnya', '');
}

function openEditTarget(id){
  toast('Edit target akan tersedia di update berikutnya', '');
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  // Bind login form
  $('btn-login').addEventListener('click', doLogin);
  $('login-password').addEventListener('keypress', e => { if(e.key==='Enter') doLogin(); });
  $('login-username').addEventListener('keypress', e => { if(e.key==='Enter') $('login-password').focus(); });

  // Coba auto-login
  const ok = await tryAutoLogin();
  if(ok){
    await enterApp();
  } else {
    showLogin();
  }
});
</script>
